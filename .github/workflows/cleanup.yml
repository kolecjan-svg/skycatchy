name: Database Cleanup

on:
  schedule:
    # Every day at 02:00 UTC
    - cron: '0 2 * * *'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Days to retain deals (minimum 7)'
        required: false
        default: '7'

jobs:
  cleanup:
    name: Delete deals older than 7 days
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: importer/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: importer/src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run cleanup
        run: npm run cleanup
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '7' }}
